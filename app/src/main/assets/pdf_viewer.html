<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PDF Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <style>
        :root {
            --viewer-container-bg: #f0f0f0;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--viewer-container-bg);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #viewerContainer {
            position: absolute;
            overflow: auto;
            width: 100%;
            height: 100%;
            -webkit-overflow-scrolling: touch;
        }

        /* Reset PDF.js styles to ensure edge-to-edge full width without clipping */
        .pdfViewer .page {
            margin: 0 auto !important;
            border: none !important;
            box-shadow: none !important;
            background-color: white;
            /* Ensure the page always takes full width but preserves A4 aspect ratio */
            display: block;
        }

        /* Prevent side gaps and ensure the canvas fills the width properly */
        .pdfViewer {
            padding-bottom: 20px;
        }

        #loadingIndicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        /* Fully transparent links, no color, no hover */
        .annotationLayer .linkAnnotation > a {
            opacity: 0 !important;
            background-color: transparent !important;
            outline: none !important;
        }

        .annotationLayer .linkAnnotation > a:hover {
            opacity: 0 !important;
            background-color: transparent !important;
        }

        /* Global interaction fixes */
        * {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="loadingIndicator">Loading PDF...<br><small id="status">Starting...</small></div>
    <div id="viewerContainer">
        <div id="viewer" class="pdfViewer"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
    <script>
        const { pdfjsLib, pdfjsViewer } = window;
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const container = document.getElementById('viewerContainer');
        const eventBus = new pdfjsViewer.EventBus();

        const linkService = new pdfjsViewer.PDFLinkService({
            eventBus,
            externalLinkTarget: 2 // _blank
        });

        const pdfViewer = new pdfjsViewer.PDFViewer({
            container,
            eventBus,
            linkService,
            l10n: pdfjsViewer.NullL10n,
            useOnlyCssZoom: true,
            textLayerMode: 1,
            annotationMode: 1,
            removePageBorders: true,
        });
        linkService.setViewer(pdfViewer);

        // Precise scaling function to match container width
        function fitToWidth() {
            if (pdfViewer.pdfDocument) {
                // Use 'page-width' which is the standard PDF.js way to fit A4/any page to container width
                pdfViewer.currentScaleValue = 'page-width';
            }
        }

        eventBus.on('pagesinit', fitToWidth);
        window.addEventListener('resize', fitToWidth);

        // Refresh scale after pages are rendered to catch any layout shifts
        eventBus.on('pagerendered', function(e) {
            if (e.pageNumber === 1) {
                fitToWidth();
            }
        });

        function loadPdf(url) {
            document.getElementById('status').innerText = 'Downloading...';
            const loadingTask = pdfjsLib.getDocument({
                url: url,
                cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                cMapPacked: true,
                disableAutoFetch: false,
                disableStream: false
            });

            loadingTask.promise.then(function(pdfDocument) {
                pdfViewer.setDocument(pdfDocument);
                linkService.setDocument(pdfDocument, null);
                document.getElementById('loadingIndicator').style.display = 'none';
            }, function (reason) {
                showError(reason);
            });
        }

        function showError(reason) {
            console.error('Error: ', reason);
            document.getElementById('loadingIndicator').innerHTML = 'Error loading PDF<br><small>' + (reason.message || reason) + '</small>';
            if (window.Android) {
                window.Android.onError(reason.message || reason.toString());
            }
        }

        window.addEventListener('click', function(e) {
            const target = e.target.closest('a');
            if (target && target.href) {
                const href = target.href;
                if (href.startsWith('http') || (href.includes(':') && !href.startsWith('blob:') && !href.includes('#'))) {
                    if (window.Android) {
                        window.Android.onLinkClick(href);
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }
            }
        }, true);
    </script>
</body>
</html>
