<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
    <style>
        body { margin: 0; padding: 0; background-color: #525659; overflow: hidden; }
        #viewerContainer {
            position: absolute;
            overflow: auto;
            width: 100%;
            height: 100%;
            -webkit-overflow-scrolling: touch;
        }
        .pdfViewer .page {
            margin: 10px auto;
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        #loadingIndicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loadingIndicator">Loading PDF...<br><small id="status">Starting...</small></div>
    <div id="viewerContainer">
        <div id="viewer" class="pdfViewer"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>
    <script>
        const { pdfjsLib, pdfjsViewer } = window;
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const container = document.getElementById('viewerContainer');
        const eventBus = new pdfjsViewer.EventBus();

        const linkService = new pdfjsViewer.PDFLinkService({
            eventBus,
            externalLinkTarget: 2 // _blank
        });

        const pdfViewer = new pdfjsViewer.PDFViewer({
            container,
            eventBus,
            linkService,
            l10n: pdfjsViewer.NullL10n,
            useOnlyCssZoom: true,
            textLayerMode: 1,
            annotationMode: 1,
        });
        linkService.setViewer(pdfViewer);

        eventBus.on('pagesinit', function () {
            pdfViewer.currentScaleValue = 'page-width';
        });

        function loadPdf(url) {
            document.getElementById('status').innerText = 'Downloading...';
            const loadingTask = pdfjsLib.getDocument({
                url: url,
                cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
                cMapPacked: true,
            });

            loadingTask.promise.then(function(pdfDocument) {
                pdfViewer.setDocument(pdfDocument);
                linkService.setDocument(pdfDocument, null);
                document.getElementById('loadingIndicator').style.display = 'none';
            }, function (reason) {
                showError(reason);
            });
        }

        function showError(reason) {
            console.error('Error: ', reason);
            document.getElementById('loadingIndicator').innerHTML = 'Error loading PDF<br><small>' + (reason.message || reason) + '</small>';
            if (window.Android) {
                window.Android.onError(reason.message || reason.toString());
            }
        }

        window.addEventListener('click', function(e) {
            const target = e.target.closest('a');
            if (target && target.href) {
                const href = target.href;
                // If it's a real link (not an internal PDF link)
                if (href.startsWith('http') || (href.includes(':') && !href.startsWith('blob:') && !href.includes('#'))) {
                    if (window.Android) {
                        window.Android.onLinkClick(href);
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }
            }
        }, true);
    </script>
</body>
</html>
